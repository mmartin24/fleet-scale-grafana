apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: fleet-results
spec:
  replicas: 1
  strategy:
    type: Recreate # hostPath volume can't be attached from two pods at once
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8
          env:
            # Recent images auto-generate a random password for the default
            # user unless told not to; this is a local-only spike, keep it
            # passwordless.
            - name: CLICKHOUSE_SKIP_USER_SETUP
              value: "1"
          ports:
            - containerPort: 8123
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
      volumes:
        - name: data
          # Backed by a host dir bind-mounted into the k3d node at cluster
          # create time (-v flag in up.sh), so it survives `k3d cluster
          # delete` - a normal PVC would not, since local-path-provisioner
          # storage lives inside the node container's own writable layer.
          hostPath:
            path: /data/clickhouse
            type: DirectoryOrCreate
        - name: init-sql
          configMap:
            name: clickhouse-init
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: fleet-results
spec:
  type: NodePort
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
      nodePort: 30081
